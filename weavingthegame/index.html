<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/styles.css">
    <title>Weaving Schematics</title>
</head>

<body>

    <form id="weavingForm">

<!-- row 1 -->
<div class="field" id="f1">
<label>Frame width</label>
<input type="number" id="widthFrame" value="82" min="1">
</div>

<div class="field" id="f2">
<label>Weaving height</label>
<input type="number" id="heightWeaving" value="123" min="1">
</div>

<!-- row 2 sliders -->
<div class="field" id="f3">
<label>Cell size (<span id="cellSizeVal" class="value">8</span>)</label>
<input type="range" id="cellSize" min="4" max="50" value="8">
</div>

<div class="field" id="f4">
<label>Tail (<span id="tailVal" class="value">1</span>)</label>
<input type="range" id="tail" min="1" max="10" value="1">
</div>

<div class="field" id="f5">
<label>Thread thickness (<span id="threadThicknessVal" class="value">3</span>)</label>
<input type="range" id="threadThickness" min="1" max="20" value="3">
</div>

<!-- row 3 -->
<div class="field" id="f6">
<label>Frame patterns</label>
<textarea id="framesInput">ooxx, oxxo, xxoo, xoox</textarea>
</div>

<div class="field" id="f7">
<label>Color sequence</label>
<input type="text" id="colorSequence" value="aaabbbdddaaadddbbcececececececccccecececeeee">
</div>

<!-- row 4 symmetric -->
<div id="sym">
<label>Symmetric</label>
<input type="checkbox" id="symmetric">
</div>

<!-- colors unchanged but grouped visually -->
<div class="color-group" style="grid-column:1/-1">
<div class="color-field"><label>A</label><input type="color" id="colorA" value="#e63946"></div>
<div class="color-field"><label>B</label><input type="color" id="colorB" value="#2a9d8f"></div>
<div class="color-field"><label>C</label><input type="color" id="colorC" value="#e9c46a"></div>
<div class="color-field"><label>D</label><input type="color" id="colorD" value="#457b9d"></div>
<div class="color-field"><label>E</label><input type="color" id="colorE" value="#6d2b7e"></div>
</div>

</form>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
